product:
  type: kmp/lib
  platforms: [ jvm ]

dependencies:
  - $compose.runtime
  - $compose.foundation
  - $compose.material3
  - $compose.ui
  - $compose.components.resources
  - $compose.preview
  - $compose.hotReload.runtimeApi
  - $libs.androidx.lifecycle.viewmodel.compose
  - $libs.androidx.lifecycle.runtime.compose
  # Compose ur Pres — https://github.com/KodeinKoders/CuP
  - $libs.cup: exported
  - $libs.cup.widgets.material3: exported
  - $libs.cup.widgets.sourceCode: exported
  - $libs.cup.plugin.speakerWindow: exported
  - $libs.cup.plugin.laser: exported
  - $libs.cup.plugin.imageExport: exported

test-dependencies:
  # The Skia native library, needed to compile a shader in a test.
  - $compose.desktop.currentOs

settings:
  jvm:
    # The CuP syntax highlighter runs highlight.js on GraalJS.
    # GraalJS needs sun.misc.Unsafe.ensureClassInitialized, which JDK 25 removed.
    release: 21
    jdk:
      version: 21
  compose:
    enabled: true
    resources:
      packageName: de.myposter.academy.shaders.resources
      # Generate public accessors so other modules (and previews) can use Res.*
      exposedAccessors: true
